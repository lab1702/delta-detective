[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-detective"
version = "0.1.0"
description = "Evidence-backed local snapshot reconciliation"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "PyYAML>=6,<7", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
delta-detective = "delta_detective.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
